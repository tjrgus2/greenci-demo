name: GreenCI Intelligence Demo

# A deliberately inefficient pipeline used to validate GreenCI's DAG critical
# path, recommendation rules, policy engine, and JUnit artifact analysis.
#
#   build ──▶ unit-test ──▶ integration-test        (critical path)
#   security (3-way matrix)                          (parallel hotspot)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: npm ci
        run: sleep 25
      - name: npm run build
        run: sleep 10

  unit-test:
    name: Unit test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: npm ci
      # Optimization: the dependency cache populated by Build now hits here.
        run: sleep 2
      - name: npm test
        run: sleep 15
      - name: Write JUnit report
        run: |
          mkdir -p reports
          cat > reports/junit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="unit.parser" tests="3" failures="0" time="4.8">
              <testcase classname="unit.parser" name="parses a header" time="0.4" />
              <testcase classname="unit.parser" name="parses a body" time="0.6" />
              <testcase classname="unit.parser" name="handles a large document" time="3.8" />
            </testsuite>
            <testsuite name="unit.router" tests="2" failures="0" time="1.1">
              <testcase classname="unit.router" name="resolves a route" time="0.5" />
              <testcase classname="unit.router" name="rejects an unknown route" time="0.6" />
            </testsuite>
          </testsuites>
          XML
      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: reports/junit.xml
          retention-days: 1

  integration-test:
    name: Integration test
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: npm ci
      # Optimization: the dependency cache populated by Build now hits here.
        run: sleep 2
      - name: Run integration tests
        run: sleep 45

  security:
    name: Security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Optimization: the full matrix moves to the default branch schedule.
        rule: [secrets]
    steps:
      - name: Scan
        run: sleep 40

  greenci:
    name: GreenCI
    if: always()
    needs:
      - build
      - unit-test
      - integration-test
      - security

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Analyze CI
        uses: tjrgus2/GreenCI@f073d91778055e55e75332c08e764b139cb70e4d
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
